<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register user</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="shell">

    <header class="masthead">
        <p class="eyebrow">New record</p>
        <h1>Register a user</h1>
        <p>Username and email must be unique across the directory.</p>
    </header>

    <div class="panel">
        <form class="form-body" th:action="@{/users/register}" th:object="${user}" method="post">

            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}"
                       th:classappend="${#fields.hasErrors('username')} ? 'invalid'"/>
                <span class="hint" th:unless="${#fields.hasErrors('username')}">At least 10 characters.</span>
                <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'invalid'"/>
                <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'invalid'"/>
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="actions">
                <button class="btn" type="submit">Register user</button>
                <a class="link" th:href="@{/users}">Cancel</a>
            </div>

        </form>
    </div>

</div>
</body>
</html>
