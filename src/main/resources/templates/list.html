<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="shell">

    <header class="masthead">
        <p class="eyebrow">User directory</p>
        <h1>Users</h1>
        <p>Every record is addressable by its primary key.</p>
    </header>

    <div class="panel">
        <ul class="records">
            <li th:each="user : ${users}">
                <a class="record" th:href="@{/users/{id}(id=${user.id})}">
                    <span class="record-key" th:text="${user.id}">1</span>
                    <span class="record-name" th:text="${user.username}">username</span>
                </a>
            </li>
            <li th:if="${#lists.isEmpty(users)}">
                <p class="empty">No users yet. Register the first one.</p>
            </li>
        </ul>
    </div>

    <div class="toolbar">
        <a class="link" th:href="@{/users/register}">Register new user</a>
        <span class="count"
              th:text="${#lists.size(users)} + ' record' + (${#lists.size(users)} == 1 ? '' : 's')">0 records</span>
    </div>

</div>
</body>
</html>
