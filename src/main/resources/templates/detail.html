<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'User · ' + ${user.username}">User</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="shell">

    <header class="masthead">
        <p class="eyebrow">Record</p>
        <h1 th:text="${user.username}">username</h1>
    </header>

    <div class="panel">
        <dl class="fields" th:object="${user}">
            <div class="field-row">
                <dt>ID</dt>
                <dd th:text="*{id}">1</dd>
            </div>
            <div class="field-row">
                <dt>Username</dt>
                <dd th:text="*{username}">username</dd>
            </div>
            <div class="field-row">
                <dt>Email</dt>
                <dd th:text="*{email}">email</dd>
            </div>
        </dl>
    </div>

    <p class="footnote">Passwords are never rendered, hashed or otherwise.</p>

    <div class="toolbar">
        <a class="link" th:href="@{/users}">Back to all users</a>
    </div>

</div>
</body>
</html>
